name: Keep Sonara backend warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        env:
          API_URL: ${{ secrets.SONARA_API_URL }}
        run: curl --fail --silent --show-error --max-time 20 "$API_URL/api/health"
      - name: Precompute daily mixes
        if: ${{ secrets.CRON_SECRET != '' }}
        env:
          API_URL: ${{ secrets.SONARA_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: curl --fail --silent --show-error --max-time 25 -X POST -H "x-cron-secret: $CRON_SECRET" "$API_URL/api/internal/jobs/daily-mixes"
