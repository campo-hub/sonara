<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>AgriStore</title></head>
  <body>
    <script>
      const base = '/sonara';
      const path = location.pathname.startsWith(base) ? location.pathname.slice(base.length) : location.pathname;
      const route = `${path}${location.search}${location.hash}`;
      location.replace(`${base}/?__spa=${encodeURIComponent(route)}`);
    </script>
  </body>
</html>
