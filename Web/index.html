<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#23523a" />
    <meta name="description" content="Discover fresh produce from Kenyan farmers on AgriStore." />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/agristore.svg" />
    <title>AgriStore — Kenyan farm produce</title>
    <script type="module">
      (() => {
        const params = new URLSearchParams(location.search);
        const redirect = params.get('__spa');
        if (redirect) {
          const base = import.meta.env.BASE_URL.replace(/\/$/, '');
          history.replaceState(null, '', `${base}${redirect}`);
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
